# StreamTablet: keep USB-tethered Android devices off the default route.
#
# USB tethering does two things at once. It creates the direct PC <-> tablet
# link that StreamTablet streams over, and it also offers the tablet as an
# internet gateway. If the PC accepts that gateway, every packet it sends to
# the internet is routed over the same USB link as the video and NAT'd by the
# same tablet that is decoding it. Browsing then competes with the stream for
# the link and for the tablet's CPU, and the frame rate collapses to zero
# whenever anything else uses bandwidth.
#
# A high route metric leaves the link fully usable for streaming while making
# any real interface (ethernet, Wi-Fi) win the default route. Unlike
# ipv4.never-default this degrades gracefully: if the tethered device is the
# only thing connected, it still provides internet rather than leaving the
# machine offline.
#
# Install with scripts/setup_usb_link.sh, or copy to
# /etc/NetworkManager/conf.d/ and run `nmcli general reload conf`.

[connection-stream-tablet-usb]
match-device=driver:rndis_host,driver:cdc_ncm,driver:cdc_ether,driver:cdc_mbim
ipv4.route-metric=4000
ipv6.route-metric=4000
